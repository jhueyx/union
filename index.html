<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- iOS / mobile PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sally & Jason" />
    <link rel="manifest" href="/manifest.json" id="webManifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Sally &amp; Jason</title>
    <meta name="description" content="We're getting married. Our wedding website is currently being prepared as we finalize the details." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fafafa" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sallyjason.com/" />
    <meta property="og:title" content="Sally &amp; Jason" />
    <meta property="og:description" content="We're getting married." />
    <meta property="og:image" content="https://sallyjason.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sally &amp; Jason" />
    <meta name="twitter:description" content="We're getting married." />
    <meta name="twitter:image" content="https://sallyjason.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sallyjason.com/" />

    <!-- Fonts: Inter (weights 200–500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent background flash before CSS loads. The site is light-only, so
         this is a single colour rather than a prefers-color-scheme switch.
         color-scheme keeps native controls (inputs, scrollbars, date pickers)
         light too — without it the browser draws them from the OS theme, so a
         guest on a dark phone got dark form fields on a white page. -->
    <style>
      html {
        background: #fafafa;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
